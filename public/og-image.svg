    </text>

    <text y="182" font-family="Inter, sans-serif" font-size="30" fill="#9BA1A8">
      Interface to database to deployment.
    </text>

    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" fill="#9BA1A8">
      <g transform="translate(0 250)">
