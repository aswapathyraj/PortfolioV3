<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Aswapathy Raj — Full-Stack Developer">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#00E5A0" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1A1F24" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#08090A" />
  <rect width="1200" height="630" fill="url(#grid)" />
