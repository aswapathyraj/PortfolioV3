<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08090A" />

    <!-- SPA owns scroll position: stop Chrome restoring the previous page's
         mid-page offset on refresh / restart (would land on the project
         cards instead of the hero). -->
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual'
      }
    </script>

    <!--
      Static copies of the primary tags so crawlers that do not execute JS still
      get them. The live values are driven from src/config.js via <Seo /> — keep
      the two in sync if you change your name or headline.
    -->
    <title>Aswapathy Raj — Full-Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Aswapathy Raj, a full-stack developer building modern web applications with React, Node.js, APIs, and databases."
    />
    <meta name="author" content="Aswapathy Raj" />
    <!--
      No static canonical tag: with no siteUrl configured it could only point at
      "/", which the build treats as an asset path. <Seo /> emits the canonical
      link at runtime from src/config.js instead.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aswapathy Raj" />
    <meta property="og:title" content="Aswapathy Raj — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Portfolio of Aswapathy Raj, a full-stack developer building modern web applications with React, Node.js, APIs, and databases."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aswapathy Raj — Full-Stack Developer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aswapathy Raj — Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Aswapathy Raj, a full-stack developer building modern web applications with React, Node.js, APIs, and databases."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Aswapathy Raj — Full-Stack Developer" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="ard" href="/.well-known/ard.json" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/space-grotesk-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono-latin.woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Aswapathy Raj",
        "jobTitle": "Full-Stack Developer",
        "description": "Full-stack developer building modern web applications with React, Node.js, REST APIs, and SQL databases.",
        "knowsAbout": [
          "React",
          "JavaScript",
          "Node.js",
          "Express.js",
          "REST API design",
          "SQLite",
          "SQL",
          "Tailwind CSS",
          "JWT authentication",
          "Web application security"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; max-width: 36rem; margin: 0 auto; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>Aswapathy Raj — Full-Stack Developer</h1>
        <p>
          I build modern, scalable web applications from interface to database and deployment,
          using React, Node.js, REST APIs, and SQLite.
        </p>
        <p>
          <a href="mailto:aswapathyraj@gmail.com">aswapathyraj@gmail.com</a> ·
          <a href="https://github.com/aswapathyraj">GitHub</a> ·
          <a href="/resume.pdf">Resume (PDF)</a>
        </p>
        <p>
          This portfolio uses React for its interactive sections (case studies, API explorer,
          architecture diagrams). Please enable JavaScript for the full experience, or reach
          out directly by email.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
